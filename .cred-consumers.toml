  redeploy = true

  [[credential.consumer]]
  kind = "runtime-fetch"
  repo = "orchestrator"
  ref = "scripts/run-estate-landing.sh, run-bump-proposer.sh, run-inert-landing.sh, run-work-carrier.sh"

