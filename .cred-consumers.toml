# .cred-consumers.toml — WS-0.7 rotation-lane consumer inventory for the M2M bearers
# change-manager authenticates (app/config.py, app/auth.py).
#
# Read by infraops-mcp-server's nightly security-drift run (src/security-drift/
# cred-rotation.ts) once this file's absolute path is listed in
# ~/.config/infra-drift/cred-consumers.list. Schema, consumer kinds and the strict
# subset-TOML rules are documented in infraops-mcp-server/.cred-consumers.toml.
#
# Each bearer's Coolify env var on the change-manager app (prod, re45tafypao3nly3qa9a79dp)
# holds only its sha256 hash, as one JSON entry keyed by scope (docs/operations/
# bearer-settings.md, ADR-0055 increment 6): kind coolify-env-hash is declarative, so the
# executor can never write a raw value there. Every consumer fetches its BWS keeper by
# UUID at runtime. NO entry carries consumers_verified (not fingerprint-swept), and the class
# is executor:false, so every rotation is the manual checklist. Dates are BWS
# creationDate. Values NEVER appear here.

version = 1

[[credential]]
id = "change-manager-full-bearer"
class = "change-manager-m2m-bearer"
provider = "change-manager"
provider_identity = "FULL scope (M2M_TOKEN)"
bws_uuid = "af0e4192-edc6-46ae-9e4f-b469011dbb8d"
created = "2026-06-14"
disposition = "reissue"
# Handed to the rotation executor 2026-10-26 (intent-packages rotation-change-manager-full-bearer
# rev 1, approved by Devon 2026-10-23).
rotated_by_sds = true
rotate_requested = "2026-10-26"

  [[credential.consumer]]
  kind = "bws-secret"
  uuid = "af0e4192-edc6-46ae-9e4f-b469011dbb8d"
  note = "change-manager/M2M_TOKEN (Rotation / Keepers) — keeper"

  [[credential.consumer]]
  kind = "coolify-env-hash"
  instance = "prod"
  resource_type = "application"
  uuid = "re45tafypao3nly3qa9a79dp"
  key = "M2M_TOKEN"
  entry = "full"
  note = "full entry (sha256 only)"

  [[credential.consumer]]
  kind = "runtime-fetch"
  repo = "infraops-mcp-server"
  ref = "scripts/drift-audit.sh"
  note = "launchd com.devon.infra-drift 03:00; Keychain Claude/BWS_ACCESS_TOKEN_INFRA_DRIFT (broad account); its change-manager calls (sync, security-drift run) only log a WARN on failure and the run still pings success, so no read shows it switched: a person attests it (orchestrator adapter change-manager-attested)"

  [[credential.consumer]]
  kind = "runtime-fetch"
  repo = "infraops-mcp-server"
  ref = "scripts/change-window.sh"
  healthchecks_check = "Change Manager OPs Check"
  note = "launchd com.devon.change-window 04:00; Keychain Claude/BWS_ACCESS_TOKEN_INFRA_DRIFT (broad account); an empty or refused bearer exits 1 and pings /fail; Healthchecks check Change Manager OPs Check (slug operations-check)"

  [[credential.consumer]]
  kind = "runtime-fetch"
  repo = "security-standards"
  ref = "scripts/factory-events-nightly.sh"
  healthchecks_check = "factory-events"
  note = "deployed to ~/.claude/bin; launchd com.devon.factory-events 03:30; Keychain Claude/BWS_ACCESS_TOKEN_VPS_BACKUP (broad account), fetched after /start, empty exits 1 and pings /fail; Healthchecks check factory-events (slug factory-events)"

