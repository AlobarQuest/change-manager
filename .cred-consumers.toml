created = "2026-08-11"
disposition = "reissue"

  [[credential.consumer]]
  kind = "bws-secret"
  uuid = "314f276d-55ca-4ddc-a24d-b4a3013508cd"
  note = "change-manager/M2M_TOKEN_READ (Ops / Platform) — keeper"

  [[credential.consumer]]
  kind = "coolify-env"
  instance = "prod"
