[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "change-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "jinja2>=3.1",
]

[dependency-groups]
# Dev toolchain — installed by `uv sync` (default group) so `make check` and CI
# run the real linters/type-checker/tests instead of silently skipping them.
# ruff/pyright are pinned to the versions recorded in .code-standards.toml so
# local == CI (the gate is version-sensitive: a newer linter can flag new rules).
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff==0.15.20",
  "pyright==1.1.411",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# FastAPI evaluates Depends() at request time, not as a real mutable default —
# whitelisting it is the framework-correct way to silence B008 (not a suppression).
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "C90"]

[tool.pyright]
typeCheckingMode = "basic"
