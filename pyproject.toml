[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "change-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.51.0",
  "sqlalchemy>=2.0.52",
  "alembic>=1.19.1",
  "psycopg[binary]>=3.3.4",
  "pydantic>=2.6",
  "pydantic-settings>=2.15.0",
  "jinja2>=3.1",
]

[dependency-groups]
# Dev toolchain — installed by `uv sync` (default group) so `make check` and CI
# run the real linters/type-checker/tests instead of silently skipping them.
# ruff/pyright are pinned to the versions recorded in .code-standards.toml so
# local == CI (the gate is version-sensitive: a newer linter can flag new rules).
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff==0.16.4",
  "pyright==1.1.411",
  "httpx2>=2.12.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# ruff 0.16 formats Python code blocks inside Markdown; 0.15 did not. The affected
# files here are ADRs and historical plan documents — the record, not code — so the
# formatter is excluded from them rather than allowed to rewrite them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# FastAPI evaluates Depends() at request time, not as a real mutable default —
# whitelisting it is the framework-correct way to silence B008 (not a suppression).
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "C90"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  "**/alembic",
  "**/migrations",
  "build",
]
