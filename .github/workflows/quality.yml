# code-standards GitHub Actions workflow (vendored).
# Destination: .github/workflows/quality.yml
# Edit upstream and `code-standards sync`.
#
# IMPORTANT: Keep tool versions here in sync with your local pins (pyproject.toml,
# package.json, etc.). Local == CI parity is enforced by design.

name: Quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
        # Skipped entirely when package.json does not exist (pure-Python repos).

      - name: Install Node dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run full quality check
        # `make check` runs ruff, pyright, eslint, prettier, shellcheck, and pytest.
        # Each tool is command -v guarded so absent tools degrade gracefully.
        run: make check
